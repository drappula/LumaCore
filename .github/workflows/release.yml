name: Build & Release
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
# Serialise releases: two rapid pushes must not compute the same tag.
concurrency:
  group: lumacore-release
  cancel-in-progress: false
jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compute next version
        id: version
        shell: pwsh
        run: |
          # Tags look like V36, V37, ... SteaMidra treats any tag mismatch
          # as "update available", so this repo must stay above upstream
          # KoriaPolis/LumaCore (currently V36) or existing installs
          # would be "updated" to an older build.
          # NOTE: a failed `gh release list` must fail this step, never
          # silently default to V37 (that collided with the real V37 once
          # when the API call hiccuped and stderr was swallowed).
          $errFile = Join-Path $env:RUNNER_TEMP "gh-releases.err"
          $tags = gh release list --limit 30 --json tagName --jq '.[].tagName' 2>$errFile
          if ($LASTEXITCODE -ne 0) {
            $err = Get-Content $errFile -Raw -ErrorAction SilentlyContinue
            if ([string]::IsNullOrWhiteSpace($tags) -and $err -match 'no releases|Could not resolve|404') {
              echo "No releases yet -> starting at V37"
              "tag=V37" >> $env:GITHUB_OUTPUT
              $LASTEXITCODE = 0
              exit 0
            }
            Write-Error "gh release list failed; refusing to guess next tag: $err"
            exit 1
          }
          $max = 36
          foreach ($o in @($tags)) {
            foreach ($t in ($o -split '\r?\n')) {
              $m = [regex]::Match($t.Trim(), '^V(\d+)$')
              if ($m.Success) {
                $n = [int]$m.Groups[1].Value
                if ($n -gt $max) { $max = $n }
              }
            }
          }
          $next = $max + 1
          while (gh release view "V$next" --json tagName --jq '.tagName' 2>$null) {
            echo "Tag V$next already exists, trying next"
            $next++
          }
          # Reset or pwsh reports the stale native exit code and fails the step.
          $LASTEXITCODE = 0
          echo "Next tag: V$next"
          "tag=V$next" >> $env:GITHUB_OUTPUT
      - name: Set up CMake 3.x and Ninja
        # Runner images now ship CMake 4.x, which removed compatibility
        # with <3.5. The pinned deps (protobuf, spdlog) still declare
        # those floors, so configure fails there. 3.31 builds them fine.
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: 3.31.6
      - name: Configure (Ninja Multi-Config, x64)
        # CMake 3.31 predates VS 2026, so its default generator cannot
        # target it ("Visual Studio 18" is unknown there). Ninja only
        # needs cl.exe on PATH, which the MSVC step above provides.
        shell: pwsh
        run: cmake -S source -B build -G "Ninja Multi-Config"
      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel
      - name: Build Debug
        shell: pwsh
        run: cmake --build build --config Debug --parallel
      - name: Verify DLLs
        shell: pwsh
        run: |
          foreach ($dll in @("LumaCore.dll", "LumaCorePayload.dll", "xinput1_4.dll")) {
            foreach ($cfg in @("Release", "Debug")) {
              $p = Join-Path "build" (Join-Path $cfg $dll)
              if (-not (Test-Path -LiteralPath $p)) { throw "Missing $p" }
            }
          }
          echo "All 3 DLLs present in both configs."
      - name: Pack artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($cfg in @("Release", "Debug")) {
            $files = @("LumaCore.dll", "LumaCorePayload.dll", "xinput1_4.dll") | ForEach-Object { Join-Path "build" (Join-Path $cfg $_) }
            Compress-Archive -Force -Path $files -DestinationPath "dist\$cfg.zip"
          }
          Get-ChildItem dist
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --target "$env:GITHUB_SHA" --title "LumaCore ${{ steps.version.outputs.tag }}" --generate-notes "dist/Release.zip" "dist/Debug.zip"
